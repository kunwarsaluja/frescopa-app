<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Frescopa</title>
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="app.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="bar">
    <button class="back" id="back" type="button" hidden></button>
    <span class="logo">frescopa</span>
  </header>
  <main id="view"></main>
  <!-- shown when the app document can't load (its labels come from that document) -->
  <template id="start-error">
    <div class="status" role="alert">
      <p>Frescopa can’t load right now.</p>
      <button class="button" type="button">Try again</button>
    </div>
  </template>
  <nav class="tabs" id="tabs"></nav>
</body>
</html>
