<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frescopa app · content from AEM Edge Delivery Services</title>
  <link rel="icon" href="app/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="demo.css">
  <script type="module" src="demo.js"></script>
</head>
<body>
  <main class="demo">
    <div class="phone">
      <iframe id="app" src="app/" title="Frescopa app"></iframe>
    </div>
    <aside class="panel" aria-labelledby="panel-title">
      <div class="panel-head">
        <h1 id="panel-title">Live from AEM</h1>
        <button id="reload" type="button">Reload app</button>
      </div>
      <p>Content requests the app makes to the Frescopa site.</p>
      <ol id="requests"></ol>
    </aside>
  </main>
</body>
</html>
