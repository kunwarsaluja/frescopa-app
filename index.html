<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frescopa App · powered by AEM Edge Delivery (headless)</title>
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Frescopa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preload" href="fonts/montserrat.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css"></head>
<body>
<div class="stage">
  <div class="phone"><div class="notch"></div>
    <div class="screen" id="screen">
      <header class="bar"><button id="back" class="back" hidden aria-label="Back">‹</button><span class="logo">frescopa</span><span class="avatar" aria-hidden="true">A</span></header>
      <main id="view"><div class="loading">Brewing something fresh…</div></main>
      <nav class="tabs" id="tabs">
        <button data-tab="home" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/></svg>Home</button>
        <button data-tab="offers"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8Z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>Offers</button>
        <button data-tab="shop"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1 12H6Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>Shop</button>
        <button data-tab="circle"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Circle</button>
      </nav>
    </div>
  </div>
<section class="story">
    <div class="panel">
      <div class="panel-head"><span class="dot"></span> Live from AEM <button id="refresh">↻ Sync now</button></div>
      <ul id="reqlog"></ul>
    </div>
    <label class="toggle"><input type="checkbox" id="xray"> X-ray: show content sources</label>
  </section>
</div>
<script type="module" src="app.js"></script>
</body></html>
